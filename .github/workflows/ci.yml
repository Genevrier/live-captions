name: CI

on:
  push:
    branches: [ main ]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Locate Android SDK
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT"
          ls -la "$ANDROID_HOME/cmdline-tools" || true

          SDKMANAGER=$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager | head -1)

          if [ -z "$SDKMANAGER" ]; then
            echo "sdkmanager not found"
            exit 1
          fi

          echo "SDKMANAGER=$SDKMANAGER" >> "$GITHUB_ENV"
          echo "Found sdkmanager: $SDKMANAGER"

      - name: Install Android SDK packages
        run: |
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "platforms;android-35" "build-tools;35.0.0" "ndk;28.2.13676358" "cmake;3.22.1"

      - name: Fetch verified sherpa-onnx runtime
        run: |
          mkdir -p app/libs
          curl -L --fail --retry 3 -o app/libs/sherpa-onnx-1.13.8.aar \
            https://github.com/k2-fsa/sherpa-onnx/releases/download/v1.13.8/sherpa-onnx-1.13.8.aar
          echo '633c24321e06b1fe79feafa03ea16cbc0f8a286641e2da3559bac91bdb13bd96  app/libs/sherpa-onnx-1.13.8.aar' | sha256sum -c -
          mkdir -p app/build/ort
          unzip -oq app/libs/sherpa-onnx-1.13.8.aar "jni/arm64-v8a/libonnxruntime.so" -d app/build/ort

      - name: Cache pinned QNN runtime build
        id: qnn-cache
        uses: actions/cache/restore@v4
        with:
          path: app/libs/sherpa-onnx-qnn-1.13.8.aar
          key: qnn-1.13.8-ndk28.2-v1-${{ hashFiles('scripts/build_qnn.sh', 'scripts/package_qnn.py', 'app/src/main/cpp/ort/**') }}

      - name: Build experimental QNN runtime
        if: steps.qnn-cache.outputs.cache-hit != 'true'
        env:
          ANDROID_NDK: ${{ env.ANDROID_HOME }}/ndk/28.2.13676358
        run: |
          export ANDROID_NDK="$ANDROID_HOME/ndk/28.2.13676358"
          bash scripts/build_qnn.sh

      - name: Save successful native runtime compilation
        if: steps.qnn-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: app/libs/sherpa-onnx-qnn-1.13.8.aar
          key: ${{ steps.qnn-cache.outputs.cache-primary-key }}

      - name: Prepare persistent signing key
        env:
          KEYSTORE_B64: ${{ secrets.LIVE_CAPTIONS_KEYSTORE_B64 }}
        run: |
          test -n "$KEYSTORE_B64"
          printf '%s' "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/live-captions.jks"
          echo "LIVE_CAPTIONS_KEYSTORE=$RUNNER_TEMP/live-captions.jks" >> "$GITHUB_ENV"

      - name: Build signed release APK and test
        env:
          LIVE_CAPTIONS_STORE_PASSWORD: ${{ secrets.LIVE_CAPTIONS_STORE_PASSWORD }}
          LIVE_CAPTIONS_KEY_PASSWORD: ${{ secrets.LIVE_CAPTIONS_KEY_PASSWORD }}
        run: |
          chmod +x gradlew
          ./gradlew :app:testReleaseUnitTest :app:assembleRelease -Pqnn=true --no-daemon --stacktrace --max-workers=2

      - name: Verify installable APK
        run: |
          apk=app/build/outputs/apk/release/app-release.apk
          unzip -t "$apk" | tail -1
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose --print-certs "$apk"
          "$ANDROID_HOME/build-tools/35.0.0/zipalign" -c -P 16 4 "$apk"
          python3 scripts/verify_apk.py "$apk"
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging "$apk" | head -12
          unzip -Z1 "$apk" | grep -q '^lib/arm64-v8a/libsherpa-onnx-jni.so$'
          unzip -Z1 "$apk" | grep -q '^lib/arm64-v8a/libonnxruntime.so$'
          if unzip -Z1 "$apk" | grep -Eq '^lib/(x86|armeabi-v7a)/'; then exit 1; fi

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: live-captions-arm64-release
          path: app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error

      - name: Write APK SHA-256
        run: sha256sum app/build/outputs/apk/release/app-release.apk > app-release.apk.sha256

      - name: Upload checksum
        uses: actions/upload-artifact@v4
        with:
          name: live-captions-arm64-sha256
          path: app-release.apk.sha256
          if-no-files-found: error

      - name: Upload unit test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: unit-test-reports
          path: app/build/test-results/testReleaseUnitTest/*.xml
          if-no-files-found: warn
