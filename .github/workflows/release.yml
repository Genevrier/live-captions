name: Release

on:
  push:
    tags: [ 'v*' ]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Locate Android SDK
        run: |
          SDKMANAGER=$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager | head -1)
          test -n "$SDKMANAGER"
          echo "SDKMANAGER=$SDKMANAGER" >> "$GITHUB_ENV"

      - name: Install SDK packages
        run: |
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "platforms;android-35" "build-tools;35.0.0" "ndk;28.2.13676358" "cmake;3.22.1"

      - name: Fetch verified sherpa-onnx runtime
        run: |
          mkdir -p app/libs
          curl -L --fail --retry 3 -o app/libs/sherpa-onnx-1.13.8.aar \
            https://github.com/k2-fsa/sherpa-onnx/releases/download/v1.13.8/sherpa-onnx-1.13.8.aar
          echo '633c24321e06b1fe79feafa03ea16cbc0f8a286641e2da3559bac91bdb13bd96  app/libs/sherpa-onnx-1.13.8.aar' | sha256sum -c -
          mkdir -p app/build/ort
          unzip -oq app/libs/sherpa-onnx-1.13.8.aar "jni/arm64-v8a/libonnxruntime.so" -d app/build/ort

      - name: Cache pinned QNN runtime build
        id: qnn-cache
        uses: actions/cache@v4
        with:
          path: app/libs/sherpa-onnx-qnn-1.13.8.aar
          key: qnn-1.13.8-ndk28.2-v1-${{ hashFiles('scripts/build_qnn.sh', 'scripts/package_qnn.py', 'app/src/main/cpp/ort/**') }}

      - name: Build experimental QNN runtime
        if: steps.qnn-cache.outputs.cache-hit != 'true'
        env:
          ANDROID_NDK: ${{ env.ANDROID_HOME }}/ndk/28.2.13676358
        run: |
          export ANDROID_NDK="$ANDROID_HOME/ndk/28.2.13676358"
          bash scripts/build_qnn.sh

      - name: Save successful native runtime compilation
        if: steps.qnn-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: app/libs/sherpa-onnx-qnn-1.13.8.aar
          key: ${{ steps.qnn-cache.outputs.cache-primary-key }}

      - name: Prepare persistent signing key
        env:
          KEYSTORE_B64: ${{ secrets.LIVE_CAPTIONS_KEYSTORE_B64 }}
        run: |
          test -n "$KEYSTORE_B64"
          printf '%s' "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/live-captions.jks"
          echo "LIVE_CAPTIONS_KEYSTORE=$RUNNER_TEMP/live-captions.jks" >> "$GITHUB_ENV"

      - name: Build signed release APK
        env:
          LIVE_CAPTIONS_STORE_PASSWORD: ${{ secrets.LIVE_CAPTIONS_STORE_PASSWORD }}
          LIVE_CAPTIONS_KEY_PASSWORD: ${{ secrets.LIVE_CAPTIONS_KEY_PASSWORD }}
        run: |
          chmod +x gradlew
          ./gradlew :app:testReleaseUnitTest :app:assembleRelease -Pqnn=true --no-daemon --stacktrace --max-workers=2

      - name: Stage APK
        run: |
          mkdir -p out
          cp app/build/outputs/apk/release/app-release.apk "out/live-captions-${GITHUB_REF_NAME}.apk"
          sha256sum "out/live-captions-${GITHUB_REF_NAME}.apk" > "out/live-captions-${GITHUB_REF_NAME}.apk.sha256"

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: ${{ github.ref_name }}
          tag_name: ${{ github.ref_name }}
          generate_release_notes: true
          files: out/*
